apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-payment-pvc
  namespace: uav-store
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-payment
  namespace: uav-store
  labels:
    app: postgres-payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-payment
  template:
    metadata:
      labels:
        app: postgres-payment
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: payment-db-password
            - name: POSTGRES_DB
              value: payment_db
          volumeMounts:
            - name: postgres-payment-storage
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - payment_db
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - payment_db
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-payment-storage
          persistentVolumeClaim:
            claimName: postgres-payment-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-payment
  namespace: uav-store
  labels:
    app: postgres-payment
spec:
  selector:
    app: postgres-payment
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-payment-external
  namespace: uav-store
  labels:
    app: postgres-payment
spec:
  selector:
    app: postgres-payment
  ports:
    - name: postgres
      protocol: TCP
      port: 5436
      targetPort: 5432
  type: LoadBalancer
