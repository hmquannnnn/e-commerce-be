apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: uav-store
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: wait-for-postgres-order
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-order.uav-store.svc.cluster.local 5432; do
                echo "Waiting for postgres-order..."; sleep 2;
              done
              echo "postgres-order is ready"
        - name: run-migrations
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              if [ "$ENV" != "local" ]; then
                echo "ENV=$ENV: migrations handled by CI/CD, skipping..."
                exit 0
              fi
              export DATABASE_URL="postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}"
              echo "ENV=local: running migrations..."
              for f in $(ls /migrations/*.sql | sort); do
                echo "Applying $f..."
                psql "$DATABASE_URL" -f "$f"
              done
              echo "Migrations completed"
          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: ENV
            - name: DB_HOST
              value: postgres-order.uav-store.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: order_db
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: order-db-password
            - name: DB_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_SSL_MODE
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: order-migrations
      containers:
        - name: order-service
          image: hmquannnnn/order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: APP_PORT
              value: "8085"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: APP_ENV
            - name: DB_HOST
              value: postgres-order.uav-store.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: order-db-password
            - name: DB_NAME
              value: order_db
            - name: DB_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_SSL_MODE
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: PRODUCT_SERVICE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: uav-store
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 8085
      targetPort: 8085
  type: ClusterIP
