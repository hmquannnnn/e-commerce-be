apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: uav-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-user.uav-store.svc.cluster.local 5432; do
                echo "Waiting for postgres-user..."; sleep 2;
              done
              echo "postgres-user is ready"
        - name: run-migrations
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              if [ "$ENV" != "local" ]; then
                echo "ENV=$ENV: migrations handled by CI/CD, skipping..."
                exit 0
              fi
              export DATABASE_URL="postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}"
              echo "ENV=local: running migrations..."
              for f in $(ls /migrations/*.sql | sort); do
                echo "Applying $f..."
                psql "$DATABASE_URL" -f "$f"
              done
              echo "Migrations completed"
          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: ENV
            - name: DB_HOST
              value: postgres-user.uav-store.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: user_db
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: user-db-password
            - name: DB_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_SSL_MODE
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: user-migrations
      containers:
        - name: user-service
          image: hmquannnnn/user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: APP_PORT
              value: "8081"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: APP_ENV
            - name: DB_HOST
              value: postgres-user.uav-store.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: user-db-password
            - name: DB_NAME
              value: user_db
            - name: DB_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_SSL_MODE
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: jwt-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: uav-store
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
