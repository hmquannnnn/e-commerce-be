apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: uav-store
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
        - name: wait-for-postgres-payment
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-payment.uav-store.svc.cluster.local 5432; do
                echo "Waiting for postgres-payment..."; sleep 2;
              done
              echo "postgres-payment is ready"
        - name: run-migrations
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              if [ "$ENV" != "local" ]; then
                echo "ENV=$ENV: migrations handled by CI/CD, skipping..."
                exit 0
              fi
              export DATABASE_URL="postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}"
              echo "ENV=local: running migrations..."
              for f in $(ls /migrations/*.sql | sort); do
                echo "Applying $f..."
                psql "$DATABASE_URL" -f "$f"
              done
              echo "Migrations completed"
          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: ENV
            - name: DB_HOST
              value: postgres-payment.uav-store.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: payment_db
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: payment-db-password
            - name: DB_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_SSL_MODE
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: payment-migrations
      containers:
        - name: payment-service
          image: hmquannnnn/payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          env:
            - name: APP_PORT
              value: "8086"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: APP_ENV
            - name: DB_HOST
              value: postgres-payment.uav-store.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: payment-db-password
            - name: DB_NAME
              value: payment_db
            - name: DB_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_SSL_MODE
            - name: PAYOS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: payos-client-id
            - name: PAYOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: payos-api-key
            - name: PAYOS_CHECKSUM_KEY
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: payos-checksum-key
            - name: PAYOS_RETURN_URL
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: PAYOS_RETURN_URL
            - name: PAYOS_CANCEL_URL
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: PAYOS_CANCEL_URL
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: ORDER_SERVICE_URL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: uav-store
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - port: 8086
      targetPort: 8086
  type: ClusterIP
