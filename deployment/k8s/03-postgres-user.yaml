apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-user-pvc
  namespace: uav-store
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-user
  namespace: uav-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-user
  template:
    metadata:
      labels:
        app: postgres-user
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: user-db-password
            - name: POSTGRES_DB
              value: user_db
          volumeMounts:
            - name: postgres-user-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-user-storage
          persistentVolumeClaim:
            claimName: postgres-user-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-user
  namespace: uav-store
spec:
  selector:
    app: postgres-user
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-user-external
  namespace: uav-store
spec:
  selector:
    app: postgres-user
  ports:
    - name: postgres
      protocol: TCP
      port: 5433
      targetPort: 5432
  type: LoadBalancer
